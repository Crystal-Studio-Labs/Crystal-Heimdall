services:
  - type: web
    name: crystal-heimdall
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3030
      - key: JWT_SECRET
        generateValue: true
      - key: TOTP_SECRET
        sync: false
