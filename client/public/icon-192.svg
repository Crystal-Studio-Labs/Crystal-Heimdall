  <circle cx="96" cy="96" r="88" fill="#070a0f" stroke="#10b981" stroke-width="8"/>
  <circle cx="96" cy="96" r="76" fill="#18181b" stroke="#059669" stroke-width="3"/>
  
  <!-- Subtle Radar Crosshair Ring -->
  <circle cx="96" cy="96" r="60" fill="none" stroke="#064e3b" stroke-width="1.5" stroke-dasharray="4,6"/>

