<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Crystal Heimdall</title>
    
    <!-- PWA Web Manifest & App Meta -->
    <link rel="manifest" href="/manifest.webmanifest?v=5" />
    <meta name="theme-color" content="#070a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crystal Heimdall" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <meta name="msapplication-TileImage" content="/icon-512.png?v=5" />
    <meta name="msapplication-TileColor" content="#070a0f" />

    <!-- Search Engine & Social Media Open Graph Fallbacks (Non-JS crawlers) -->
    <meta name="description" content="Crystal Heimdall // Continuous Multi-Protocol Health Sentinel & Autonomous Incident Status by Crystal Studio Labs." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Crystal Heimdall // Autonomous Reliability Sentinel" />
    <meta property="og:description" content="Continuous multi-protocol health monitoring, TLS certificate inspection, and real-time public status board." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Crystal Heimdall System Health Sentinel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crystal Heimdall // Autonomous Reliability Sentinel" />
    <meta name="twitter:description" content="Continuous multi-protocol health monitoring, TLS certificate inspection, and real-time public status board." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Industrial Brutalism Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#070a0f] text-zinc-100 min-h-screen antialiased selection:bg-emerald-400 selection:text-black font-mono">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
              reg.update();
            },
            (err) => console.log('[PWA] ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
