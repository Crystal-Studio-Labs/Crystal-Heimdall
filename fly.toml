app = "crystal-heimdall"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3030"
  NODE_ENV = "production"

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "heimdall_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
