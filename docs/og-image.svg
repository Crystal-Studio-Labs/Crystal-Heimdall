<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Deep Dark Background -->
  <rect width="1200" height="630" fill="#070a0f"/>
  
  <!-- Subtle Grid Lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Industrial Double Border -->
  <rect x="24" y="24" width="1152" height="582" stroke="#27272a" stroke-width="3" fill="none"/>
  <rect x="32" y="32" width="1136" height="566" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" fill="none"/>

  <!-- Corner Brackets -->
  <path d="M 32 60 L 32 32 L 60 32" stroke="#10b981" stroke-width="4" fill="none"/>
  <path d="M 1168 60 L 1168 32 L 1140 32" stroke="#10b981" stroke-width="4" fill="none"/>
  <path d="M 32 570 L 32 598 L 60 598" stroke="#10b981" stroke-width="4" fill="none"/>
  <path d="M 1168 570 L 1168 598 L 1140 598" stroke="#10b981" stroke-width="4" fill="none"/>

  <!-- Status Stamp Badge Top Left -->
  <g transform="translate(70, 70)">
    <rect width="320" height="40" fill="#090d14" stroke="#27272a" stroke-width="2"/>
    <rect x="4" y="4" width="312" height="32" fill="#000000"/>
    <circle cx="24" cy="20" r="6" fill="#10b981"/>
    <text x="40" y="25" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" letter-spacing="2">[ FLEET STATUS: NOMINAL ]</text>
  </g>

  <!-- Organization Badge Top Right -->
  <g transform="translate(850, 70)">
    <rect width="280" height="40" fill="#090d14" stroke="#27272a" stroke-width="2"/>
    <rect x="4" y="4" width="272" height="32" fill="#000000"/>
    <text x="20" y="25" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" letter-spacing="2">CRYSTAL STUDIO LABS</text>
  </g>

  <!-- Main Hero Icon Box (Matching Dashboard Badge) -->
  <g transform="translate(70, 160)">
    <rect x="6" y="6" width="90" height="90" fill="#000000"/>
    <rect width="90" height="90" fill="#18181b" stroke="#10b981" stroke-width="3.5"/>
    <g transform="translate(15, 15) scale(2.5)">
      <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Main Title -->
  <text x="180" y="210" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="900" letter-spacing="-1">CRYSTAL HEIMDALL</text>
  <text x="182" y="245" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" letter-spacing="3">AUTONOMOUS RELIABILITY SENTINEL // UPTIME TRACKER</text>

  <!-- Subtitle / Tagline -->
  <text x="70" y="320" fill="#d4d4d8" font-family="'Inter', sans-serif" font-size="24" font-weight="500">
    Industrial Brutalism Telemetry Hub, Synthetic Uptime Poller &amp; Crash Sink
  </text>
  <text x="70" y="356" fill="#71717a" font-family="'Inter', sans-serif" font-size="19" font-weight="400">
    Continuous multi-point health monitoring, RFC 6238 2FA-Only gate, and multi-period SLA tracking.
  </text>

  <!-- 3 Spec Block Panels in Industrial Brutalism Bento -->
  <!-- Block 1 -->
  <g transform="translate(70, 410)">
    <rect width="330" height="130" fill="#0b0f17" stroke="#27272a" stroke-width="2"/>
    <rect x="4" y="4" width="322" height="122" fill="#000000"/>
    <text x="20" y="35" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">[ ENGINE MATRIX ]</text>
    <text x="20" y="75" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900">99.9% SLA</text>
    <text x="20" y="105" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="11">Continuous 60s Synthetics</text>
  </g>

  <!-- Block 2 -->
  <g transform="translate(435, 410)">
    <rect width="330" height="130" fill="#0b0f17" stroke="#27272a" stroke-width="2"/>
    <rect x="4" y="4" width="322" height="122" fill="#000000"/>
    <text x="20" y="35" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">[ ACCESS PROTOCOL ]</text>
    <text x="20" y="75" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900">2FA ONLY</text>
    <text x="20" y="105" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="11">RFC 6238 TOTP Gate</text>
  </g>

  <!-- Block 3 -->
  <g transform="translate(800, 410)">
    <rect width="330" height="130" fill="#0b0f17" stroke="#27272a" stroke-width="2"/>
    <rect x="4" y="4" width="322" height="122" fill="#000000"/>
    <text x="20" y="35" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">[ AUDITORY SENTINEL ]</text>
    <text x="20" y="75" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900">SIREN PWA</text>
    <text x="20" y="105" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="11">Web Audio Multi-Oscillator</text>
  </g>
</svg>
